<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="wall.docTitle">OmniSight 监控墙</title>
    <style>
        :root {
            --bg: #0e0f12;
            --panel: #16181d;
            --border: #2a2d35;
            --text: #e6e8ec;
            --muted: #8b90a0;
            --accent: #76b900;
            --danger: #e5484d;
        }
        /* Light theme — follows the platform's localStorage 'theme' setting */
        body.light {
            --bg: #f4f6f8;
            --panel: #ffffff;
            --border: #e1e4ea;
            --text: #1a1c22;
            --muted: #6b7280;
            --accent: #5e9400;
            --danger: #d63a3f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        header {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; background: var(--bg); z-index: 20;
        }
        header h1 { font-size: 18px; margin: 0; }
        header h1 .accent { color: var(--accent); }
        header .sub { color: var(--muted); font-size: 13px; }
        header .spacer { flex: 1; }
        header a.single, header button.lang {
            color: var(--muted); font-size: 13px; text-decoration: none;
            border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px;
            background: transparent; cursor: pointer;
        }
        header a.single:hover, header button.lang:hover { color: var(--text); }

        .addbar {
            display: flex; gap: 8px; padding: 12px 20px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border); background: var(--panel);
        }
        .addbar input {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 8px 10px; border-radius: 6px; font-size: 14px;
        }
        .addbar input#camUrl { flex: 1; min-width: 260px; }
        .addbar button.add {
            background: var(--accent); color: #000; border: none; font-weight: 600;
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        .addbar button.add:hover { filter: brightness(1.1); }
        .addbar button.tool {
            background: transparent; color: var(--text); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        .addbar button.tool:hover { border-color: var(--danger); color: var(--danger); }
        .addbar .hint { color: var(--muted); font-size: 12px; width: 100%; }

        #grid {
            display: grid; gap: 12px; padding: 16px 20px;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        }
        .cell {
            background: #000; border: 1px solid var(--border); border-radius: 10px;
            overflow: hidden; position: relative; aspect-ratio: 4 / 3;
            display: flex; flex-direction: column;
        }
        .cell .video-wrap { position: relative; flex: 1; min-height: 0; background: #000; }
        .cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .cell .badge {
            position: absolute; top: 8px; left: 8px; z-index: 3;
            font-size: 12px; padding: 3px 8px; border-radius: 12px;
            background: rgba(0,0,0,0.6); display: flex; align-items: center; gap: 6px;
        }
        .cell .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
        .cell .badge.online .dot { background: var(--accent); }
        .cell .badge.offline .dot { background: var(--danger); }
        .cell .remove {
            position: absolute; top: 8px; right: 8px; z-index: 3;
            background: rgba(0,0,0,0.6); color: var(--text); border: none; cursor: pointer;
            width: 26px; height: 26px; border-radius: 50%; font-size: 14px; line-height: 1;
        }
        .cell .remove:hover { background: var(--danger); color: #fff; }
        .cell .vlm {
            background: var(--panel); border-top: 1px solid var(--border);
            padding: 8px 10px; font-size: 13px; line-height: 1.4; min-height: 42px;
            color: var(--text); max-height: 96px; overflow: auto;
        }
        .cell .vlm .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
        .cell .vlm .src {
            color: var(--muted); font-size: 11px; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .cell .vlm .src b { color: var(--text); }
        .empty { color: var(--muted); padding: 40px 20px; text-align: center; grid-column: 1 / -1; }

        /* Offline (D-6) / paused (on-demand) overlays — text set via data-msg for i18n */
        .cell.offline img { opacity: 0.3; filter: grayscale(0.7); }
        .cell.offline .video-wrap::after,
        .cell.paused .video-wrap::after {
            content: attr(data-msg); position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; pointer-events: none;
            font-size: 14px; letter-spacing: 1px;
        }
        .cell.offline .video-wrap::after { color: var(--danger); }
        .cell.paused .video-wrap::after { color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <h1><span class="accent">OmniSight</span> <span data-i18n="wall.titleSuffix">监控墙</span></h1>
        <span class="sub" id="summary"></span>
        <span class="spacer"></span>
        <button class="lang" id="themeToggle" onclick="cycleTheme()" title="主题 / Theme"></button>
        <button class="lang" id="langToggle" onclick="toggleLang()">EN</button>
        <a class="single" href="/" data-i18n="wall.singleView">单路视图</a>
    </header>

    <div class="addbar">
        <input id="camId" data-i18n-ph="wall.camIdPh" size="14">
        <input id="camUrl" data-i18n-ph="wall.camUrlPh">
        <input id="camPrompt" data-i18n-ph="wall.camPromptPh" size="20">
        <button class="add" onclick="addCamera()" data-i18n="wall.addBtn">添加摄像头</button>
        <button class="tool" onclick="removeOffline()" data-i18n="wall.removeOffline">移除离线</button>
        <button class="tool" onclick="removeDuplicates()" data-i18n="wall.removeDup">去重</button>
        <div class="hint" data-i18n="wall.addHint">边缘设备(带检测框)请用 /camera 路径 + 同主机的 /boxes 自动叠框;框由浏览器绘制。</div>
    </div>

    <div id="grid"><div class="empty" id="emptyMsg" data-i18n="wall.empty">还没有摄像头。在上方添加一路开始。</div></div>

    <script>
        // ── i18n ──────────────────────────────────────────────────────────────
        const I18N = {
            "wall.docTitle":   { zh: "OmniSight 监控墙", en: "OmniSight Wall" },
            "wall.titleSuffix":{ zh: "监控墙", en: "Wall" },
            "wall.singleView": { zh: "单路视图", en: "Single view" },
            "wall.camIdPh":    { zh: "摄像头 ID (如 cam1)", en: "Camera ID (e.g. cam1)" },
            "wall.camUrlPh":   { zh: "源地址 rtsp://… 或 http://host:8088/camera 或 local://dev",
                                 en: "Source rtsp://… or http://host:8088/camera or local://dev" },
            "wall.camPromptPh":{ zh: "提示词(可选)", en: "Prompt (optional)" },
            "wall.addBtn":     { zh: "添加摄像头", en: "Add camera" },
            "wall.addHint":    { zh: "边缘设备(带检测框)请用 /camera 路径 + 同主机的 /boxes 自动叠框;框由浏览器绘制。",
                                 en: "For edge devices with detections, use the /camera path; boxes are auto-overlaid from /boxes on the same host (drawn in the browser)." },
            "wall.empty":      { zh: "还没有摄像头。在上方添加一路开始。", en: "No cameras yet. Add one above to start." },
            "wall.cams":       { zh: " 路", en: " cams" },
            "wall.waiting":    { zh: "等待分析…", en: "Waiting for analysis…" },
            "wall.offline":    { zh: "离线", en: "offline" },
            "wall.reconnect":  { zh: "重连", en: "reconnecting" },
            "wall.offlineOverlay": { zh: "离线", en: "OFFLINE" },
            "wall.pausedOverlay":  { zh: "已暂停（滚动到此恢复）", en: "Paused (scroll here to resume)" },
            "wall.confirmRemove":  { zh: "移除摄像头 ", en: "Remove camera " },
            "wall.needFields": { zh: "请填写 摄像头 ID 和 源地址", en: "Please enter camera ID and source URL" },
            "wall.addFailed":  { zh: "添加失败: ", en: "Add failed: " },
            "wall.dupWarnA":   { zh: "该源地址已被摄像头「", en: "This source is already used by camera \"" },
            "wall.dupWarnB":   { zh: "」使用。\n\n多人/多处观看同一路：直接多开本页即可（共享同一源连接、不增加设备负载），无需重复添加。\n\n仍要继续添加吗？",
                                 en: "\".\n\nTo watch one camera from multiple places, just open this page in more tabs — they share the one source connection (no extra device load); no need to add it again.\n\nAdd it anyway?" },
            "wall.removeOffline":{ zh: "移除离线", en: "Remove offline" },
            "wall.removeDup":  { zh: "去重", en: "Dedupe" },
            "wall.noneToRemove":{ zh: "没有可移除的摄像头", en: "No cameras to remove" },
            "wall.confirmRemoveOffline": { zh: "移除以下离线摄像头？\n", en: "Remove these offline cameras?\n" },
            "wall.confirmRemoveDup":     { zh: "移除以下重复源摄像头（每个源保留一路）？\n", en: "Remove these duplicate-source cameras (keep one per source)?\n" },
            "wall.latency":    { zh: "延迟 ", en: "latency " },
            "wall.totalRuns":  { zh: " 次", en: "" },
            "wall.totalPrefix":{ zh: " · 共 ", en: " · " },
            "wall.theme.auto": { zh: "自动", en: "Auto" },
            "wall.theme.light":{ zh: "浅色", en: "Light" },
            "wall.theme.dark": { zh: "深色", en: "Dark" },
        };
        let lang = localStorage.getItem('lang') || 'zh';
        function t(key) { const e = I18N[key]; return e ? (e[lang] != null ? e[lang] : e.en) : key; }
        function applyI18n() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
            const btn = document.getElementById('langToggle');
            if (btn) btn.textContent = lang === 'zh' ? 'EN' : '中';
            // re-render dynamic bits
            refreshDynamicText();
        }
        function toggleLang() {
            lang = lang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('lang', lang);
            applyI18n();
        }

        // ── theme: follow the platform's shared localStorage 'theme' (light/dark/auto) ──
        function resolveAndApplyTheme() {
            const saved = localStorage.getItem('theme') || 'auto';
            let light;
            if (saved === 'light') light = true;
            else if (saved === 'dark') light = false;
            else light = window.matchMedia('(prefers-color-scheme: light)').matches;
            document.body.classList.toggle('light', light);
            const tb = document.getElementById('themeToggle');
            if (tb) tb.textContent = t('wall.theme.' + saved);
        }
        function cycleTheme() {
            const order = ['auto', 'light', 'dark'];
            const cur = localStorage.getItem('theme') || 'auto';
            localStorage.setItem('theme', order[(order.indexOf(cur) + 1) % 3]);
            resolveAndApplyTheme();
        }
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
            if ((localStorage.getItem('theme') || 'auto') === 'auto') resolveAndApplyTheme();
        });
        window.addEventListener('storage', (e) => {
            if (e.key === 'theme') resolveAndApplyTheme();
            if (e.key === 'lang') { lang = localStorage.getItem('lang') || 'zh'; applyI18n(); }
        });

        function refreshDynamicText() {
            // waiting placeholders + offline/paused overlays + summary
            for (const id of Object.keys(cells)) {
                const cell = cells[id];
                const textEl = cell.vlm.querySelector('.text');
                if (textEl && textEl.dataset.waiting === '1') textEl.textContent = t('wall.waiting');
                if (cell.el.classList.contains('paused')) cell.wrap.dataset.msg = t('wall.pausedOverlay');
                else if (cell.el.classList.contains('offline')) cell.wrap.dataset.msg = t('wall.offlineOverlay');
            }
            updateSummary(lastCount);
            const tb = document.getElementById('themeToggle');
            if (tb) tb.textContent = t('wall.theme.' + (localStorage.getItem('theme') || 'auto'));
        }

        // ── state ─────────────────────────────────────────────────────────────
        const cells = {};      // camera_id -> { el, wrap, img, canvas, vlm, badge, boxTimer, boxesUrl, paused }
        let websocket = null;
        let lastCount = 0;

        function updateSummary(n) {
            lastCount = n;
            document.getElementById('summary').textContent = n + t('wall.cams');
        }

        function deriveBoxesUrl(videoUrl) {
            try {
                const u = new URL(videoUrl, window.location.href);
                if (!u.protocol.startsWith('http')) return null;
                return u.origin + '/boxes';
            } catch (e) { return null; }
        }

        // ── WebSocket: per-camera VLM results (broadcast, tagged camera_id) ──
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            websocket = new WebSocket(`${proto}://${location.host}/ws?session_id=wall`);
            websocket.onmessage = (ev) => {
                let data; try { data = JSON.parse(ev.data); } catch (e) { return; }
                if (data.type === 'vlm_response' && data.camera_id && cells[data.camera_id]) {
                    const c = cells[data.camera_id];
                    const textEl = c.vlm.querySelector('.text');
                    textEl.dataset.waiting = '0';
                    textEl.textContent = data.text || '';
                    if (data.metrics) {
                        const m = data.metrics;
                        c.vlm.querySelector('.meta').textContent =
                            t('wall.latency') + Math.round(m.last_latency_ms || 0) + 'ms'
                            + t('wall.totalPrefix') + (m.total_inferences || 0) + t('wall.totalRuns');
                    }
                }
            };
            websocket.onclose = () => { websocket = null; setTimeout(connectWS, 2000); };
            websocket.onerror = () => { try { websocket.close(); } catch (e) {} };
        }

        // ── detection-box overlay per cell ──
        function drawBoxes(cell, boxes) {
            const canvas = cell.canvas, img = cell.img;
            const wrapRect = canvas.getBoundingClientRect();
            const cw = Math.round(wrapRect.width), ch = Math.round(wrapRect.height);
            if (canvas.width !== cw) canvas.width = cw;
            if (canvas.height !== ch) canvas.height = ch;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, cw, ch);
            if (!boxes || !boxes.length) return;
            const nw = img.naturalWidth, nh = img.naturalHeight;
            if (!nw || !nh) return;
            const ir = img.getBoundingClientRect();
            const scale = Math.min(ir.width / nw, ir.height / nh);
            const dw = nw * scale, dh = nh * scale;
            const ox = (ir.left - wrapRect.left) + (ir.width - dw) / 2;
            const oy = (ir.top - wrapRect.top) + (ir.height - dh) / 2;
            ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(118,185,0,0.95)';
            ctx.font = '13px sans-serif'; ctx.textBaseline = 'top';
            for (const b of boxes) {
                const x = ox + b.x * dw, y = oy + b.y * dh, w = b.w * dw, h = b.h * dh;
                ctx.strokeRect(x, y, w, h);
                const label = b.label + (b.conf != null ? ' ' + Math.round(b.conf * 100) + '%' : '');
                const tw = ctx.measureText(label).width;
                const ly = Math.max(0, y - 17);
                ctx.fillStyle = 'rgba(118,185,0,0.95)';
                ctx.fillRect(x, ly, tw + 8, 17);
                ctx.fillStyle = '#000'; ctx.fillText(label, x + 4, ly + 2);
            }
        }

        function startBoxPoll(cell) {
            if (!cell.boxesUrl) return;
            if (cell.boxTimer) clearInterval(cell.boxTimer);
            const poll = async () => {
                try {
                    const resp = await fetch('/api/boxes?url=' + encodeURIComponent(cell.boxesUrl));
                    const data = await resp.json();
                    drawBoxes(cell, data.boxes || []);
                } catch (e) { /* keep last */ }
            };
            poll();
            cell.boxTimer = setInterval(poll, 120);
        }

        // ── on-demand subscription: pause off-screen cells ──
        const cellObserver = new IntersectionObserver((entries) => {
            for (const e of entries) {
                const cell = cells[e.target.dataset.cameraId];
                if (!cell) continue;
                if (e.isIntersecting) resumeCell(cell, e.target.dataset.cameraId);
                else pauseCell(cell);
            }
        }, { rootMargin: '120px' });

        // ── 视频走单条 WS 多路复用：整页只占 1 条连接，绕开浏览器每域名 ~6 连接上限 ──
        let videoWS = null;
        const objUrls = {};   // camera_id -> 当前帧的 object URL（用完即回收，避免泄漏）

        function wantedCameraIds() {
            // 只订阅"在线 && 可见"的格子
            return Object.keys(cells).filter(id => cells[id].online !== false && !cells[id].paused);
        }
        function resubscribe() {
            if (videoWS && videoWS.readyState === WebSocket.OPEN) {
                videoWS.send(JSON.stringify({ type: 'subscribe', camera_ids: wantedCameraIds() }));
            }
        }
        function connectVideoWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            videoWS = new WebSocket(`${proto}://${location.host}/ws/video`);
            videoWS.binaryType = 'arraybuffer';
            videoWS.onopen = resubscribe;
            videoWS.onmessage = (ev) => {
                if (typeof ev.data === 'string') return;       // 帧只走二进制
                const buf = ev.data;
                const hlen = new DataView(buf).getUint16(0);   // [2字节头长][camera_id][jpeg]
                const cid = new TextDecoder().decode(new Uint8Array(buf, 2, hlen));
                const cell = cells[cid];
                if (!cell) return;
                const blob = new Blob([new Uint8Array(buf, 2 + hlen)], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                if (objUrls[cid]) URL.revokeObjectURL(objUrls[cid]);
                objUrls[cid] = url;
                cell.img.src = url;
            };
            videoWS.onclose = () => { videoWS = null; setTimeout(connectVideoWS, 2000); };
            videoWS.onerror = () => { try { videoWS.close(); } catch (e) {} };
        }

        // 是否取流 = 在线 && 可见。视频帧由 videoWS 推送；这里只管框轮询 + 离线/离屏的清理。
        // （订阅集的更新由 resubscribe() 在 loadCameras/暂停/恢复 时统一发送，避免逐格刷屏。）
        function refreshStream(cell, id) {
            const on = cell.online !== false && !cell.paused;
            if (on) {
                startBoxPoll(cell);
            } else {
                if (cell.boxTimer) { clearInterval(cell.boxTimer); cell.boxTimer = null; }
                if (objUrls[id]) { URL.revokeObjectURL(objUrls[id]); delete objUrls[id]; }
                cell.img.removeAttribute('src');
            }
        }
        function pauseCell(cell) {
            if (cell.paused) return;
            cell.paused = true;
            cell.el.classList.add('paused');
            cell.wrap.dataset.msg = t('wall.pausedOverlay');
            refreshStream(cell, cell.el.dataset.cameraId);
            resubscribe();
        }
        function resumeCell(cell, id) {
            if (!cell.paused) return;
            cell.paused = false;
            cell.el.classList.remove('paused');
            refreshStream(cell, id);
            resubscribe();
        }

        function createCell(cam) {
            const el = document.createElement('div');
            el.className = 'cell';
            el.innerHTML = `
                <div class="badge"><span class="dot"></span><span class="label"></span></div>
                <button class="remove" title="✕">✕</button>
                <div class="video-wrap"><img alt="${cam.camera_id}"><canvas></canvas></div>
                <div class="vlm"><div class="src"><b class="cid"></b> · <span class="curl"></span></div><div class="text" data-waiting="1"></div><div class="meta"></div></div>
            `;
            const cell = {
                el,
                wrap: el.querySelector('.video-wrap'),
                img: el.querySelector('img'),
                canvas: el.querySelector('canvas'),
                vlm: el.querySelector('.vlm'),
                badge: el.querySelector('.badge'),
                url: cam.url,
                boxesUrl: deriveBoxesUrl(cam.url),
                boxTimer: null,
                paused: false,
            };
            el.dataset.cameraId = cam.camera_id;
            el.querySelector('.badge .label').textContent = cam.camera_id;
            el.querySelector('.cid').textContent = cam.camera_id;
            el.querySelector('.curl').textContent = cam.url;
            el.querySelector('.src').title = cam.camera_id + ' · ' + cam.url;
            el.querySelector('.text').textContent = t('wall.waiting');
            el.querySelector('.remove').onclick = () => removeCamera(cam.camera_id);
            cells[cam.camera_id] = cell;
            document.getElementById('grid').appendChild(el);
            refreshStream(cell, cam.camera_id);   // 初始即拉流；后续按在线/可见态自动增减
            cellObserver.observe(el);
            return cell;
        }

        function updateBadge(cam) {
            const cell = cells[cam.camera_id];
            if (!cell) return;
            const online = cam.connected && (cam.last_frame_age == null || cam.last_frame_age < 5);
            cell.online = online;
            cell.badge.className = 'badge ' + (online ? 'online' : 'offline');
            cell.el.classList.toggle('offline', !online);
            if (!online) {
                const ctx = cell.canvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, cell.canvas.width, cell.canvas.height);
                if (!cell.el.classList.contains('paused')) cell.wrap.dataset.msg = t('wall.offlineOverlay');
            }
            const extra = online ? '' : (cam.reconnects ? ` · ${t('wall.reconnect')} ${cam.reconnects}` : ` · ${t('wall.offline')}`);
            cell.badge.querySelector('.label').textContent = cam.camera_id + extra;
            refreshStream(cell, cam.camera_id);   // 离线→释放连接；恢复在线→重新拉流
        }

        async function loadCameras() {
            let list = [];
            try { list = (await (await fetch('/api/cameras')).json()).cameras || []; } catch (e) { return; }
            const ids = new Set(list.map(c => c.camera_id));
            for (const id of Object.keys(cells)) if (!ids.has(id)) destroyCell(id);
            for (const cam of list) { if (!cells[cam.camera_id]) createCell(cam); updateBadge(cam); }
            document.getElementById('emptyMsg').style.display = list.length ? 'none' : 'block';
            updateSummary(list.length);
            resubscribe();   // 统一同步视频订阅集（新增/移除/状态变化后）
        }

        function destroyCell(id) {
            const cell = cells[id];
            if (!cell) return;
            if (cell.boxTimer) clearInterval(cell.boxTimer);
            cellObserver.unobserve(cell.el);
            if (objUrls[id]) { URL.revokeObjectURL(objUrls[id]); delete objUrls[id]; }
            cell.img.src = '';
            cell.el.remove();
            delete cells[id];
        }

        async function addCamera() {
            const camera_id = document.getElementById('camId').value.trim();
            const url = document.getElementById('camUrl').value.trim();
            const prompt = document.getElementById('camPrompt').value.trim();
            if (!camera_id || !url) { alert(t('wall.needFields')); return; }
            // 同源已存在 → 提示：多人观看应多开网页（共享连接），而非重复添加
            const dupId = Object.keys(cells).find(id => cells[id].url === url);
            if (dupId && !confirm(t('wall.dupWarnA') + dupId + t('wall.dupWarnB'))) return;
            try {
                const data = await (await fetch('/api/cameras', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ camera_id, url, prompt: prompt || undefined }),
                })).json();
                if (data.error) { alert(t('wall.addFailed') + data.error); return; }
                document.getElementById('camId').value = '';
                document.getElementById('camUrl').value = '';
                document.getElementById('camPrompt').value = '';
                loadCameras();
            } catch (e) { alert(t('wall.addFailed') + e.message); }
        }

        async function removeCamera(id) {
            if (!confirm(t('wall.confirmRemove') + id + ' ?')) return;
            try { await fetch('/api/cameras/' + encodeURIComponent(id), { method: 'DELETE' }); } catch (e) {}
            destroyCell(id);
            loadCameras();
        }

        // 批量移除：一次确认、逐个 DELETE
        async function removeMany(ids, confirmKey) {
            if (!ids.length) { alert(t('wall.noneToRemove')); return; }
            if (!confirm(t(confirmKey) + ids.join(', '))) return;
            for (const id of ids) {
                try { await fetch('/api/cameras/' + encodeURIComponent(id), { method: 'DELETE' }); } catch (e) {}
                destroyCell(id);
            }
            loadCameras();
        }
        function removeOffline() {
            const ids = Object.keys(cells).filter(id => cells[id].online === false);
            removeMany(ids, 'wall.confirmRemoveOffline');
        }
        function removeDuplicates() {
            // 同一源地址只保留一路（优先保留在线的）；其余列入待删
            const keeper = {};   // url -> 保留的 camera_id
            const dup = [];
            for (const id of Object.keys(cells)) {
                const u = cells[id].url;
                if (!(u in keeper)) { keeper[u] = id; continue; }
                const kept = cells[keeper[u]];
                if (kept.online === false && cells[id].online) { dup.push(keeper[u]); keeper[u] = id; }
                else { dup.push(id); }
            }
            removeMany(dup, 'wall.confirmRemoveDup');
        }

        applyI18n();
        resolveAndApplyTheme();
        connectWS();
        connectVideoWS();
        loadCameras();
        setInterval(loadCameras, 3000);
    </script>
</body>
</html>
